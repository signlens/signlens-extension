<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>SignLens</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="confirm consent">
        <header>
            <h1 data-l10n-id="connect-heading"></h1>
            <p id="where" class="status"></p>
        </header>

        <main>
            <p data-l10n-id="connect-address-intro"></p>
            <p><code id="address" class="watched"></code></p>
            <p class="aside" data-l10n-id="connect-aside"></p>
        </main>

        <footer>
            <p id="note" role="status" data-l10n-id="connect-question"></p>
            <div id="buttons">
                <button id="deny" type="button" data-l10n-id="connect-deny"></button>
                <button id="allow" type="button" class="primary" data-l10n-id="connect-allow"></button>
            </div>
        </footer>

        <script type="module" src="ui/connect.js"></script>
    </body>
</html>
