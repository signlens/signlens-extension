<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>SignLens</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <h1>SignLens <span class="beta" data-l10n-id="beta"></span></h1>
            <p id="engine-status" class="status" data-l10n-id="popup-checking"></p>
            <p id="permissions" hidden>
                <span data-l10n-id="popup-permissions"></span>
                <button id="allow" type="button" class="small"></button>
            </p>
            <div id="setup" hidden>
                <p id="setup-ask" data-l10n-id="popup-setup-ask"></p>
                <div id="setup-add"></div>
            </div>
        </header>

        <main>
            <div class="tabs" role="tablist" data-l10n-id="popup-views">
                <button id="tab-requests" type="button" class="tab" role="tab" aria-controls="view-requests" data-view="requests"><span id="tab-requests-name" data-l10n-id="popup-tab-requests"></span> <span id="unseen" class="count" hidden></span></button>
                <button id="tab-settings" type="button" class="tab" role="tab" aria-controls="view-settings" data-view="settings" data-l10n-id="popup-tab-settings"></button>
            </div>

            <section id="view-requests" class="view" role="tabpanel" aria-labelledby="tab-requests-name" hidden>
                <div class="list-head">
                    <h2 class="muted" data-l10n-id="popup-newest-first"></h2>
                    <button id="clear" type="button" class="small" data-l10n-id="popup-clear" hidden></button>
                </div>
                <p id="clear-status" class="save-status" role="status"></p>
                <p id="empty" tabindex="-1" data-l10n-id="popup-empty"></p>
                <ol id="history"></ol>
            </section>

            <section id="view-settings" class="view" role="tabpanel" aria-labelledby="tab-settings" hidden>
                <p id="save-status" class="save-status" role="status"></p>
                <form id="settings" autocomplete="off">
                    <fieldset>
                        <legend data-l10n-id="popup-mode-legend"></legend>
                        <label class="choice">
                            <input type="radio" name="mode" value="passthrough" />
                            <span data-l10n-id="popup-mode-pass"></span>
                        </label>
                        <label class="choice">
                            <input type="radio" name="mode" value="watch" />
                            <span data-l10n-id="popup-mode-watch"></span>
                        </label>
                    </fieldset>

                    <div id="upstream-field" class="field">
                        <label for="upstream" data-l10n-id="popup-upstream-label"></label>
                        <select id="upstream" name="upstream" aria-describedby="upstream-hint">
                            <option value="" data-l10n-id="popup-upstream-first"></option>
                        </select>
                        <small id="upstream-hint" class="note"></small>
                    </div>

                    <div id="my-addresses-field" class="field">
                        <p class="field-title" data-l10n-id="popup-yours-title"></p>
                        <div id="my-addresses"></div>
                        <small id="myAddresses-note" class="note" data-l10n-id="popup-yours-note"></small>
                    </div>

                    <div id="address-field" class="field">
                        <label for="address" data-l10n-id="popup-address-label"></label>
                        <input id="address" type="text" name="address" aria-describedby="address-hint" spellcheck="false" data-l10n-id="popup-address-field" />
                        <small id="address-hint"></small>
                    </div>

                    <div id="sites-field">
                        <p id="sites-title" class="field-title" data-l10n-id="popup-sites-title"></p>
                        <ul id="sites" aria-labelledby="sites-title"></ul>
                        <small id="sites-empty" class="note" tabindex="-1" data-l10n-id="popup-sites-empty"></small>
                    </div>

                    <!-- A choice is named by its bold words; the rest of its line describes it. popup.ts lays the two out as the line's message orders them. -->
                    <label class="choice">
                        <input type="checkbox" name="askFirst" aria-labelledby="askFirst-name" aria-describedby="askFirst-more" />
                        <span><strong id="askFirst-name" data-l10n-id="popup-ask-first-name"></strong><span id="askFirst-more" data-l10n-id="popup-ask-first-more"></span></span>
                    </label>

                    <div class="field">
                        <label for="contacts" data-l10n-id="popup-contacts-label"></label>
                        <textarea id="contacts" name="contacts" aria-describedby="contacts-hint" rows="3" spellcheck="false" data-l10n-id="popup-contacts-field"></textarea>
                        <small id="contacts-hint"></small>
                    </div>

                    <div class="field">
                        <label for="apiUrl" data-l10n-id="popup-api-label"></label>
                        <input id="apiUrl" type="text" name="apiUrl" aria-describedby="apiUrl-hint apiUrl-note" spellcheck="false" />
                        <small id="apiUrl-hint"></small>
                        <small id="apiUrl-note" class="note" data-l10n-id="popup-api-note"></small>
                    </div>

                    <div class="field">
                        <label for="rpcUrl" data-l10n-id="popup-rpc-label"></label>
                        <input id="rpcUrl" type="text" name="rpcUrl" aria-describedby="rpcUrl-hint" spellcheck="false" />
                        <small id="rpcUrl-hint"></small>
                    </div>

                    <label class="choice">
                        <input type="checkbox" name="simulate" aria-labelledby="simulate-name" aria-describedby="simulate-more" />
                        <span><strong id="simulate-name" data-l10n-id="popup-simulate-name"></strong><span id="simulate-more" data-l10n-id="popup-simulate-more"></span></span>
                    </label>

                    <label class="choice">
                        <input type="checkbox" name="lookupAccounts" aria-labelledby="accounts-name" aria-describedby="accounts-more" />
                        <span><strong id="accounts-name" data-l10n-id="popup-accounts-name"></strong><span id="accounts-more" data-l10n-id="popup-accounts-more"></span></span>
                    </label>

                    <label class="choice">
                        <input type="checkbox" name="lookupTokens" aria-labelledby="lookup-name" aria-describedby="lookup-more" />
                        <span><strong id="lookup-name" data-l10n-id="popup-tokens-name"></strong><span id="lookup-more" data-l10n-id="popup-tokens-more"></span></span>
                    </label>

                    <div id="token-api-field" class="field">
                        <label for="tokenApiUrl" data-l10n-id="popup-token-list-label"></label>
                        <input id="tokenApiUrl" type="text" name="tokenApiUrl" aria-describedby="tokenApiUrl-hint tokenApiUrl-note" spellcheck="false" />
                        <small id="tokenApiUrl-hint"></small>
                        <small id="tokenApiUrl-note" class="note" data-l10n-id="popup-token-list-note"></small>
                    </div>
                </form>
                <p class="setup-again"><button id="setup-again" type="button" class="small" data-l10n-id="popup-setup-again"></button></p>
            </section>
        </main>

        <script type="module" src="ui/popup.js"></script>
    </body>
</html>
