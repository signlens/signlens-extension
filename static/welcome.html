<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title data-l10n-id="welcome-page-title"></title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="welcome">
        <header>
            <h1>
                <img src="icons/icon-128.png" width="40" height="40" alt="" /> <span data-l10n-id="welcome-heading"></span>
                <span class="beta" data-l10n-id="beta"></span>
            </h1>
            <p id="intro" data-l10n-id="welcome-intro"></p>
        </header>

        <main>
            <section id="access" aria-labelledby="access-title" hidden>
                <h2 id="access-title" data-l10n-id="welcome-access-title"></h2>
                <p data-l10n-id="welcome-access-text"></p>
                <button id="allow" type="button" class="primary"></button>
            </section>

            <section aria-labelledby="addresses-title">
                <h2 id="addresses-title" data-l10n-id="welcome-addresses-title"></h2>
                <p data-l10n-id="welcome-addresses-text"></p>
                <div id="my-addresses"></div>
                <p id="myAddresses-note" class="note" data-l10n-id="welcome-addresses-note"></p>
            </section>

            <section aria-labelledby="use-title">
                <h2 id="use-title" data-l10n-id="welcome-use-title"></h2>
                <ol id="steps">
                    <li data-l10n-id="welcome-use-choose"></li>
                    <li data-l10n-id="welcome-use-window"></li>
                </ol>
                <p class="note" data-l10n-id="welcome-use-reconnect"></p>
                <p class="note" data-l10n-id="welcome-use-wallets"></p>
            </section>

            <section aria-labelledby="pin-title">
                <h2 id="pin-title" data-l10n-id="welcome-pin-title"></h2>
                <p id="pin-status" role="status"></p>
            </section>

            <section aria-labelledby="privacy-title">
                <h2 id="privacy-title" data-l10n-id="welcome-privacy-title"></h2>
                <p data-l10n-id="welcome-privacy-text"></p>
            </section>
        </main>

        <footer>
            <p class="note" data-l10n-id="welcome-more"></p>
            <button id="done" type="button" class="primary" data-l10n-id="welcome-done"></button>
        </footer>

        <script type="module" src="ui/welcome.js"></script>
    </body>
</html>
