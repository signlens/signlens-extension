<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>SignLens</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="confirm">
        <header>
            <h1 id="title">SignLens</h1>
            <p class="status"><span id="where"></span> <code id="what" class="method"></code></p>
            <p id="band" class="band"><span id="band-verdict" class="verdict"></span> <span id="band-summary"></span></p>
        </header>

        <main>
            <ol id="rows"></ol>
            <section id="feedback" class="feedback" hidden>
                <p id="feedback-ask" class="feedback-ask" data-l10n-id="window-feedback-ask"></p>
                <div class="feedback-buttons" role="group" aria-labelledby="feedback-ask">
                    <button type="button" class="small" data-rating="clear" aria-pressed="false" data-l10n-id="window-rating-clear"></button>
                    <button type="button" class="small" data-rating="unclear" aria-pressed="false" data-l10n-id="window-rating-unclear"></button>
                    <button type="button" class="small" data-rating="wrong" aria-pressed="false" data-l10n-id="window-rating-wrong"></button>
                </div>
                <p id="feedback-what" class="note" data-l10n-id="window-feedback-what"></p>
                <label id="feedback-cover" class="choice">
                    <input type="checkbox" name="cover" />
                    <span></span>
                </label>
                <textarea id="feedback-comment" rows="2" data-l10n-id="window-feedback-comment" hidden></textarea>
                <p id="feedback-note" class="note" role="status"></p>
            </section>
        </main>

        <footer>
            <p id="note" role="status"></p>
            <div id="buttons">
                <!-- Heard with the verdict and the summary, and Continue with what it does: the window opens on Reject. -->
                <button id="reject" type="button" aria-describedby="band" data-l10n-id="window-reject"></button>
                <button id="continue" type="button" class="primary" aria-describedby="band note" data-l10n-id="window-continue"></button>
            </div>
        </footer>

        <!-- What "Continue anyway" asks first, on a request SignLens would refuse: going back has the focus. -->
        <dialog id="anyway" aria-labelledby="anyway-title" aria-describedby="anyway-why">
            <h2 id="anyway-title" data-l10n-id="window-anyway-title"></h2>
            <p id="anyway-why"></p>
            <div class="dialog-buttons">
                <button id="anyway-back" type="button" class="primary" autofocus data-l10n-id="window-anyway-back"></button>
                <button id="anyway-go" type="button" class="danger" data-l10n-id="window-anyway-go"></button>
            </div>
        </dialog>

        <script type="module" src="ui/confirm.js"></script>
    </body>
</html>
