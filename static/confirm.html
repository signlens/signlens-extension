<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>SignLens</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="confirm">
        <header>
            <h1 id="title">SignLens</h1>
            <p class="status"><span id="where"></span> <code id="what" class="method"></code></p>
            <p id="band" class="band"><span id="band-verdict" class="verdict"></span> <span id="band-summary"></span></p>
        </header>

        <main>
            <ol id="rows"></ol>
            <section id="feedback" class="feedback" hidden>
                <p id="feedback-ask" class="feedback-ask">Was this explanation clear?</p>
                <div class="feedback-buttons" role="group" aria-labelledby="feedback-ask">
                    <button type="button" class="small" data-rating="clear" aria-pressed="false">Clear</button>
                    <button type="button" class="small" data-rating="unclear" aria-pressed="false">Unclear</button>
                    <button type="button" class="small" data-rating="wrong" aria-pressed="false">Wrong</button>
                </div>
                <p id="feedback-what" class="note">A rating sends SignLens the site, SignLens's version, what this window shows (the verdict, the findings and the programs called) and your comment. The transaction itself goes only if you tick the box below.</p>
                <label id="feedback-cover" class="choice">
                    <input type="checkbox" name="cover" />
                    <span>Send this transaction to SignLens so it can be looked into</span>
                </label>
                <textarea id="feedback-comment" rows="2" placeholder="What was unclear or wrong? (optional)" aria-label="What was unclear or wrong? (optional)" hidden></textarea>
                <p id="feedback-note" class="note" role="status"></p>
            </section>
        </main>

        <footer>
            <p id="note" role="status"></p>
            <div id="buttons">
                <!-- Heard with the verdict and the summary, and Continue with what it does: the window opens on Reject. -->
                <button id="reject" type="button" aria-describedby="band">Reject</button>
                <button id="continue" type="button" class="primary" aria-describedby="band note">Continue</button>
            </div>
        </footer>

        <!-- What "Continue anyway" asks first, on a request SignLens would refuse: going back has the focus. -->
        <dialog id="anyway" aria-labelledby="anyway-title" aria-describedby="anyway-why">
            <h2 id="anyway-title">Pass this request on anyway?</h2>
            <p id="anyway-why"></p>
            <div class="dialog-buttons">
                <button id="anyway-back" type="button" class="primary" autofocus>Go back</button>
                <button id="anyway-go" type="button" class="danger">Continue anyway</button>
            </div>
        </dialog>

        <script type="module" src="ui/confirm.js"></script>
    </body>
</html>
