<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>SignLens</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="confirm consent">
        <header>
            <h1 data-l10n-id="address-heading"></h1>
            <p id="where" class="status"></p>
        </header>

        <main>
            <p data-l10n-id="address-claimed-intro"></p>
            <p id="claimed" class="address-item"></p>
            <p id="mine-title" data-l10n-id="address-mine-title"></p>
            <ul id="mine" class="addresses" aria-labelledby="mine-title"></ul>
            <p id="mine-empty" class="aside" hidden data-l10n-id="address-mine-empty"></p>
            <p class="aside" data-l10n-id="address-warning"></p>
        </main>

        <footer>
            <p id="note" role="status" data-l10n-id="address-note"></p>
            <div id="buttons">
                <button id="reject" type="button" data-l10n-id="address-reject"></button>
                <button id="add" type="button" data-l10n-id="address-add"></button>
            </div>
        </footer>

        <script type="module" src="ui/address.js"></script>
    </body>
</html>
