# A tag `vX.Y.Z` on the default branch builds the store packages for
# Chrome and Firefox reproducibly, runs every test, the end-to-end suite
# against the live API included, and publishes the packages with their
# SHA-256s and a build provenance attestation as a GitHub release. Anyone can
# rebuild the tag with `npm ci && npm run package` and compare the hashes,
# or check the attestation with `gh attestation verify`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on the default branch and names the version in package.json
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "::error::$GITHUB_REF_NAME is not on $DEFAULT_BRANCH"
            exit 1
          }
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but package.json says $version"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            dist/*.zip
            dist/*.sha256

  e2e:
    name: Extension in Chromium, against the API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNLENS_API_URL: ${{ vars.SIGNLENS_API_URL }}
    steps:
      - name: A release is tested against an API
        run: |
          if [ -z "$SIGNLENS_API_URL" ]; then
            echo "::error::set the repository variable SIGNLENS_API_URL: a release runs the whole end-to-end suite"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # The only job that can write to the repository, and it runs no build
  # tools: it attests and publishes what the build job made.
  publish:
    name: Publish
    needs: [build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
