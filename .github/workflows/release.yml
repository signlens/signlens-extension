# A tag `vX.Y.Z` on the default branch builds the store packages for
# Chrome and Firefox reproducibly (on Linux, and again on macOS and
# Windows, which must come out the same bytes), runs every test, the
# end-to-end suite against the live API included (where a stale recording
# fails), and publishes the packages with their SHA-256s and a build
# provenance attestation as a GitHub release. Anyone can rebuild the tag
# with `npm ci && npm run package` and compare the hashes, or check the
# attestation with `gh attestation verify`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on the default branch and names the version in package.json
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "::error::$GITHUB_REF_NAME is not on $DEFAULT_BRANCH"
            exit 1
          }
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but package.json says $version"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The Node package.json's engines asks for: the one place it is said.
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            dist/*.zip
            dist/*.sha256

  e2e:
    name: Extension in Chromium, against the API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNLENS_API_URL: ${{ vars.SIGNLENS_API_URL }}
      # A release is tested against recordings that still hold.
      SIGNLENS_STRICT_RECORDINGS: '1'
    steps:
      - name: A release is tested against an API
        run: |
          if [ -z "$SIGNLENS_API_URL" ]; then
            echo "::error::set the repository variable SIGNLENS_API_URL: a release runs the whole end-to-end suite"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  package:
    name: Package on ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.os }}
          path: dist/*.sha256

  reproducible:
    name: The same packages on Linux, macOS and Windows
    needs: [build, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
      - name: Compare the hashes with the packages to publish
        run: |
          shopt -s nullglob
          compared=0
          for file in package-*/*.sha256; do
            diff "linux/$(basename "$file")" "$file"
            compared=$((compared + 1))
          done
          # Chrome's and Firefox's, from macOS and from Windows.
          if [ "$compared" -ne 4 ]; then
            echo "::error::expected 4 hashes from macOS and Windows, compared $compared"
            exit 1
          fi

  # The only job that can write to the repository, and it runs no build
  # tools: it attests and publishes what the build job made.
  publish:
    name: Publish
    needs: [build, e2e, reproducible]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
